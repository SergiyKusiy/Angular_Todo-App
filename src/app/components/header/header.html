<header class="todoapp__header">
  <form (submit)="onSubmit($event)">
    <input
      data-cy="NewTodoField"
      type="text"
      class="todoapp__new-todo"
      placeholder="What needs to be done?"
      [value]="title()"
      [disabled]="isLoading()"
      (input)="onInput($event)"
    />
  </form>
</header>
